name: IDP-CI/CD

on:
  push:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build Backend with Maven
        working-directory: backend
        run: chmod +x mvnw && ./mvnw -B package -DskipTests

  deploy-to-vps:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to New VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            APP_DIR="/root/PhamDinhTruong-CICD/Secure-Internal-Developer-Platform-IDP-"
            
            # 1. Nếu chưa có thư mục dự án thì clone mới, nếu có rồi thì pull mới nhất
            if [ ! -d "$APP_DIR" ]; then
              echo "[+] Thư mục dự án chưa tồn tại, tiến hành clone..."
              mkdir -p /root/PhamDinhTruong-CICD
              cd /root/PhamDinhTruong-CICD
              git clone https://github.com/Truong583/Secure-Internal-Developer-Platform-IDP-.git
            fi

            cd "$APP_DIR"
            echo "[+] Cập nhật mã nguồn mới nhất..."
            git fetch origin main
            git reset --hard origin/main

            # 2. Đảm bảo file .env tồn tại
            if [ ! -f ".env" ]; then
              cp .env.example .env
            fi

            # 3. Build và khởi chạy stack Docker Compose
            echo "[+] Chạy Docker Compose..."
            docker compose up -d --build --remove-orphans
            docker compose ps

            # 4. Kiểm tra sức khỏe dịch vụ (Verify)
            echo "[+] Đang kiểm tra trạng thái sức khỏe dịch vụ..."
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8000/api/health; then
                echo ""
                echo ">>> DEPLOYMENT SUCCESSFUL TO NEW VPS!"
                exit 0
              fi
              sleep 2
            done

            echo "[!] Lỗi: Backend không phản hồi sau 60s"
            docker compose logs --tail=50 backend
            exit 1
