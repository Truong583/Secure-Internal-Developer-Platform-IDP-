# ==============================================================================
# BÀI 1: CẤU HÌNH NGINX REVERSE PROXY ĐỊNH TUYẾN DOMAIN / SUBDOMAIN
# File cấu hình mẫu: /etc/nginx/sites-available/truongtest.id.vn
# ==============================================================================

# 1. DOMAIN CHÍNH: WEB GIỚI THIỆU (truongtest.id.vn hoặc example.com)
server {
    listen 80;
    server_name truongtest.id.vn example.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. SUBDOMAIN: API SERVICE (api.truongtest.id.vn hoặc api.example.com)
server {
    listen 80;
    server_name api.truongtest.id.vn api.example.com;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 3. SUBDOMAIN: ADMIN CONSOLE (admin.truongtest.id.vn hoặc admin.example.com)
server {
    listen 80;
    server_name admin.truongtest.id.vn admin.example.com;

    location / {
        proxy_pass http://127.0.0.1:3000/admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

