# ==============================================================================
# BÀI 1: CẤU HÌNH NGINX REVERSE PROXY ĐỊNH TUYẾN SUBDOMAIN
# File cấu hình: /etc/nginx/sites-available/truongtest.id.vn
# ==============================================================================

# 1. DOMAIN CHÍNH: WEB GIỚI THIỆU (truongtest.id.vn hoặc example.com)
server {
    listen 80;
    server_name truongtest.id.vn example.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. SUBDOMAIN: API SERVICE (api.truongtest.id.vn hoặc api.example.com)
server {
    listen 80;
    server_name api.truongtest.id.vn api.example.com;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 3. SUBDOMAIN: ADMIN CONSOLE (admin.truongtest.id.vn hoặc admin.example.com)
server {
    listen 80;
    server_name admin.truongtest.id.vn admin.example.com;

    location / {
        proxy_pass http://127.0.0.1:3000/admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------------------------
# GIẢI THÍCH NGẮN NỘP BÀI:
# - Subdomain dùng để làm gì trong hệ thống này:
#   Subdomain giúp chia tách các dịch vụ độc lập về mặt nghiệp vụ (Web giới thiệu,
#   API, và Admin) dưới cùng một domain chính. Mỗi service có thể phát triển,
#   bảo trì, mở rộng riêng biệt mà vẫn dùng chung 1 VPS và 1 cổng mạng 80/443.
#
# - Cách DNS Record đi nếu có domain thật:
#   Record A:  truongtest.id.vn      -> IP của VPS (hoặc Proxied qua Cloudflare)
#   Record A:  api.truongtest.id.vn  -> IP của VPS (hoặc Proxied qua Cloudflare)
#   Record A:  admin.truongtest.id.vn-> IP của VPS (hoặc Proxied qua Cloudflare)
# ------------------------------------------------------------------------------

